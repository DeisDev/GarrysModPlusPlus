# The always-visible performance overlay.
overlay.fps={value} FPS
# With frame generation: frames shown on screen per second, and how many of them the game rendered.
overlay.fps_generated={value} FPS ({rendered} rendered)
overlay.low_1=1% low: {value} FPS
overlay.low_01=0.1% low: {value} FPS
overlay.gpu_lighting=GPU lighting: {value} ms
overlay.output=Output: {width} × {height}
overlay.render=Ray tracing: {width} × {height}
# Video memory this game uses and the budget Windows gives it, in gigabytes.
overlay.memory=Video memory: {used} of {budget} GB
overlay.preset=Quality: {preset}
overlay.lights=Lights: {map} map, {dynamic} dynamic, {projected} projected
overlay.instances=Ray-traced instances: {count}

# Status lines on the game's loading screen.
loading.scene=Preparing ray-traced lighting...
loading.bake=Baking indirect light...
loading.pipelines=Preparing ray tracing shaders...
loading.shaders=Compiling shaders...

# The window shown when the game stops responding while it waits for this mod.
busy.title=GarrysMod++
busy.shaders=Compiling the shaders the game needs right now... The game continues when they are ready, and they are kept for later launches.
busy.pipelines=Preparing ray tracing shaders... The game continues in a moment.

# The notice in the corner of the screen while work runs in the background.
notice.title=GarrysMod++
notice.pipelines=Preparing ray tracing shaders: {done} of {total}
notice.shaders=Compiling shaders: {left} left
notice.shaders_background=Compiling shaders of maps played before: {done} of {total}

# The window shown at launch when the graphics card can't run the mod or its ray-traced lighting. {gpu} is the card's
# name; {missing} is a list of hardware.missing_item lines.
hardware.title=GarrysMod++
hardware.unsupported=Your graphics card can't run GarrysMod++
hardware.unsupported_body={gpu} is missing:\n{missing}\n\nA newer graphics driver may add these. You can play with the game's own graphics instead.
hardware.no_ray_tracing=Your graphics card can't run ray-traced lighting
hardware.no_ray_tracing_body={gpu} is missing:\n{missing}\n\nA newer graphics driver may add these. Until then, GarrysMod++ uses the map's baked lighting.
