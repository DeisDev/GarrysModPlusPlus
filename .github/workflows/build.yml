name: Build

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release of this version
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the version
        id: version
        env:
          RELEASE: ${{ github.event_name == 'push' || inputs.release }}
        run: |
          version=$(sed -n 's/^set(GMODPP_VERSION \([^)]*\))$/\1/p' CMakeLists.txt)
          if [[ -z "$version" ]]; then
            echo "::error::GMODPP_VERSION not found in CMakeLists.txt"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Check the release
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match GMODPP_VERSION $VERSION in CMakeLists.txt."
              exit 1
            fi
          elif git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::Tag v$VERSION already exists. Raise GMODPP_VERSION in CMakeLists.txt first."
            exit 1
          fi
          heading=$(grep -F -m1 "## [$VERSION] - " CHANGELOG.md || true)
          if [[ ! "$heading" =~ \ -\ [0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::CHANGELOG.md has no dated section '## [$VERSION] - YYYY-MM-DD'."
            exit 1
          fi
          awk -v heading="## [$VERSION] - " '
            index($0, heading) == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]*\]: /) { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "::error::The changelog section for $VERSION is empty."
            exit 1
          fi

      - name: Keep the release notes
        if: steps.version.outputs.release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 1

  build:
    needs: version
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and package
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS_PATH=%%i"
          if not defined VS_PATH (
            echo ::error::Visual Studio with the x64 C++ tools was not found
            exit /b 1
          )
          call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo || exit /b 1
          cmake --build build --target release || exit /b 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GarrysModPP-${{ needs.version.outputs.version }}
          path: build/release/GarrysModPP.zip
          if-no-files-found: error
          compression-level: 0

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: GarrysModPP-${{ needs.version.outputs.version }}
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          flags=()
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            flags+=(--verify-tag)
          else
            flags+=(--target "$GITHUB_SHA")
          fi
          gh release create "v$VERSION" dist/GarrysModPP.zip \
            --title "GarrysMod++ $VERSION" \
            --notes-file release-notes.md \
            "${flags[@]}"
